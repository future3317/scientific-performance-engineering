name: validate-skill

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gpu_validation:
        description: "Run contract checks on an explicitly configured self-hosted GPU runner"
        required: false
        default: false
        type: boolean
      formal_readiness:
        description: "Run the fail-closed formal calibration gate"
        required: false
        default: false
        type: boolean
      calibration_empirical:
        description: "Immutable empirical.json path for strict formal readiness"
        required: false
        default: "benchmark/calibration/empirical.json"
        type: string

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimum CPU PyTorch compatibility for tensor self-tests
        run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install frozen test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-ci.txt
      - name: Validate skill structure and benchmark contract
        run: |
          python scripts/generate_rule_schemas.py
          python scripts/validate_skill.py .
      - name: Run behavioral and comparator fixtures
        run: |
          python scripts/behavioral_contract_tests.py
          python scripts/validate_benchmark.py assets/benchmark_record.json
          python scripts/compare_benchmarks.py --self-test
          python assets/materials_gnn_checks.py --self-test
      - name: Run experience contract fixtures
        run: |
          python scripts/experience_contract_tests.py
          python scripts/evolution_contract_tests.py
          python scripts/evolution_utility_tests.py
          python scripts/governance_tests.py
          python scripts/rule_engine_tests.py
          python scripts/evolution_statistics_tests.py
          python scripts/validate_rule_os.py
          python scripts/validate_evolution.py .
          python scripts/validate_rule_usage.py assets/rule_usage_record.json
      - name: Compile Python tools
        run: python -m compileall -q scripts assets core benchmark
      - name: Run benchmark harness contracts
        run: |
          python -m pytest -q
          python benchmark/boundary/test_cegis.py
          python scripts/validate_acre.py
          python -m benchmark.taskgen.validate_population \
            --tasks-root benchmark/tasks \
            --out benchmark/population_report.json
          python -m benchmark.harness.cli check-leakage benchmark/split/sequential.yaml
          for task in benchmark/tasks/*; do
            python -m benchmark.harness.cli validate-task "$task"
          done

  executor-contract:
    name: executor-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Install executor smoke dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-ci.txt
      - name: Run ReferenceExecutor capability probe and attestation
        id: executor_attestation
        shell: bash
        run: |
          set +e
          python -m benchmark.formal.executor_contract --out-dir artifacts/executor-contract
          rc=$?
          set -e
          status=$(python -c 'import json; print(json.load(open("artifacts/executor-contract/smoke_result.json"))["status"])')
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "fail" ]; then
            exit "$rc"
          fi
      - name: Run formal lifecycle through the real executor path
        if: steps.executor_attestation.outputs.status == 'pass'
        run: python -m pytest -q benchmark/tests/test_reference_executor.py benchmark/tests/test_acre_full_lifecycle_e2e.py
      - name: Upload executor attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executor-contract
          path: artifacts/executor-contract
          if-no-files-found: error

  formal-readiness:
    name: formal-readiness
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_readiness == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run strict calibration/formal gate
        run: |
          python -m benchmark.taskgen.validate_population \
            --tasks-root benchmark/tasks \
            --out benchmark/population_report.json \
            --empirical "${{ inputs.calibration_empirical }}" \
            --pilot-calibration benchmark/calibration/pilot_calibration.json \
            --approval benchmark/calibration/calibration_approval.json \
            --strict-formal

  gpu-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_validation == true }}
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Run contract checks on the selected runner
        run: |
          python scripts/validate_skill.py .
          python scripts/behavioral_contract_tests.py
          python scripts/validate_benchmark.py assets/benchmark_record.json
          python assets/materials_gnn_checks.py --self-test
          nvidia-smi --query-gpu=index,uuid,name,temperature.gpu,power.draw,clocks.sm --format=csv
      - name: Explain performance-gate boundary
        run: echo "GPU performance acceptance requires a project benchmark record; this CI job does not impose a shared-runner 5% gate."
