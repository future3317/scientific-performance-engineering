    license: "Apache-2.0"
    purpose: "paired skill/no-skill arms; normalized gain; skill leakage gate; self-generated-skills control arm"
    expected_size: "~885 MB repo"
    selected_subset: "paper + README only"
    checksum: null
    cache_location: "not cached"
    large_download_required: false
    notes: "E:/CODE/SPE-EvoBench/notes/skillsbench.md"

