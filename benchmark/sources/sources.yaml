# SPE-EvoBench external sources registry.
# Every third-party artifact consulted or consumed by the benchmark is recorded here.
# Rules: nothing in this list is committed to this repository; clones/caches live
# under $SPE_BENCH_CACHE (authors' machines: E:/CODE/SPE-EvoBench). Download tooling
# is dry-run by default; entries with large_download_required=true are represented
# by instructions/manifests only and are NEVER fetched automatically.
schema_version: 1
cache_root_default: "E:/CODE/SPE-EvoBench"   # override with $SPE_BENCH_CACHE
sources:
  - id: perfopt-bench
    name: "PERFOPT-Bench: Evaluating Coding Agents on Software Performance Optimization"
    upstream_url: "https://anonymous.4open.science/r/Dataset-D3CC"
    paper: "arXiv:2607.07744 (2026)"
    pinned_version: null            # upstream repo is empty at review time
    license: "unspecified (licensing appendix blank at review time)"
    purpose: "performance-task construction via bottleneck injection; verified speedup; anti-cheat contract design"
    expected_size: "n/a (empty repo)"
    selected_subset: "paper only"
    checksum: null
    cache_location: "not cached"
    large_download_required: false
    notes: "E:/CODE/SPE-EvoBench/notes/perfopt-bench.md"

  - id: torchbench
    name: "TorchBench / pytorch userbenchmark"
    upstream_url: "https://github.com/pytorch/benchmark"
    paper: "arXiv:2304.14226"
    pinned_version: "24755807fbfdd0e9b7426f1c69a96e77aa05137a"
    license: "BSD-3-Clause"
    purpose: "harness API design; fp64 live-recomputed reference; subprocess isolation; A/B noise methodology"
    expected_size: "11 MB shallow working tree (full ~235 MB)"
    selected_subset: "shallow clone (--depth 1), code only, no model data"
    checksum: "git-commit:24755807fbfdd0e9b7426f1c69a96e77aa05137a"
    cache_location: "$SPE_BENCH_CACHE/refs/pytorch-benchmark"
    large_download_required: false
    notes: "E:/CODE/SPE-EvoBench/notes/torchbench.md"

  - id: skillsbench
    name: "SkillsBench"
    upstream_url: "https://github.com/benchflow-ai/skillsbench"
    paper: "arXiv:2602.12670 (v4)"
