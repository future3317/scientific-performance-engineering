    selected_subset: "shallow clone, trial data dirs pruned post-clone (documented in notes)"
    checksum: "git-commit:083f14de18227a1eed15758eb1a80632966525c0"
    cache_location: "$SPE_BENCH_CACHE/refs/continual-skill-bench"
    large_download_required: false
    notes: "E:/CODE/SPE-EvoBench/notes/continualskillbench.md"

