research_id: SPE-CDED-ITEM-ATTRIBUTION-PILOT-20261102
status: COHORT_MODEL_AND_COST_FROZEN_EXECUTOR_NOT_READY
source_population:
  benchmark: ALFWorld 2.1.1 official training tasks
  split_manifest_sha256: adbf45195039868fafd1d9a568b5097a681263567f3f2b868ca4ee897745337c
  eligible_task_clusters_by_split:
    train_dev: 462
    train_inner: 449
    train_outer: 460
  eligibility: >-
    Use the official source split and its corresponding new_train_dev,
    new_train_inner, or new_train_outer exposure label; require
    identity_status=IDENTIFIED, confirmatory_eligible=true for inner/outer,
    and exclude every task, cluster, and template in the stopped H1 plan or
    exposure ledger.
  historical_scope: >-
    Prior research exposed all six ALFWorld native task types. This pilot can
    estimate transfer to new semantic task clusters within selected known
    types; it cannot claim transfer to an unseen native task family.
family_split:
  rule: >-
    Native task types are disjoint across development, calibration, and final.
    Proposal evidence comes from train_dev; development and calibration use
    train_inner; final evaluation uses train_outer. Each selected task is a
    distinct semantic cluster and template. No rollout, seed, or repeated
    condition increases the independent family count.
  selection_seed: 20261102
  development_families:
    - look_at_obj_in_light
    - pick_and_place_simple
  calibration_families:
    - pick_clean_then_place_in_recep
    - pick_heat_then_place_in_recep
  evaluation_families:
    - pick_cool_then_place_in_recep
    - pick_two_obj_and_place
  excluded_unselected_families: []
  proposal_source_clusters: 2
  development_screen_clusters: 2
  evaluation_clusters: 2
  calibration_clusters: 2
  calibration: >-
    Use only train_inner calibration tasks to select the strongest simple
    baseline and whether the adaptive policy clears its frozen no-regression
    gate. Freeze those choices before opening any train_outer outcome.
  split_manifest: CDED_PILOT_SPLIT.json
mechanism:
  question: >-
    Under a fixed development-validation budget, does decision-focused
    selection of evidence-supported semantic edits improve hard-gated success
    on held-out task families over a fixed-order edit rule and a length-only
    prompt, while avoiding negative transfer?
  unit: >-
    One bounded procedural Skill item generated from a verified public trace,
    wrapped as a typed research-only candidate, and selected, rejected, or
    withheld by a loss-minimizing decision rule. This pilot does not promote a
    Rule OS rule or certify Skill applicability.
  workflow:
    - Run the unchanged base agent once on each train_dev proposal-source task and retain only public observations, actions, and task verifier outcome as proposal evidence.
    - Ask DeepSeek once per development family for one bounded candidate Skill; reject malformed or unsafe proposals without retry.
    - Freeze both candidate Skills before running parent, item-A, item-B, and character-matched length-only conditions on each distinct train_inner development task from the corresponding family.
    - Update the frozen three-hypothesis model from complete development outcomes, including a character-matched length-only control, and select retain-A, retain-B, or abstain by expected hard-gated decision loss; no composition is permitted in this pilot.
    - Run the fixed-order and adaptive policies, alongside no-skill, length-only, and static two-item controls, on the two calibration tasks.
    - Select the strongest simple calibration baseline and apply the frozen no-regression gate to the adaptive policy; freeze the chosen route and exact final arm list.
    - Run ADAPTIVE_CDED and the calibration-selected simple baseline on the two disjoint train_outer tasks even if calibration rejects adaptive deployment; label the route gate and the independent effect estimate separately.
  reused_foundations:
    - core/acre/factorial.py
    - core/skills/semantic.py
    - core/skills/evolution.py
    - experiments/scientific_skill_evolution/discriminative_planner.py
  executor_status: IMPLEMENTED_PENDING_SERVER_VALIDATION
decision_model:
  version: CDED_ITEM_SELECTION_BERNOULLI_V1
  hypotheses:
    A_ONLY: 0.25
    B_ONLY: 0.25
    NEITHER: 0.50
  development_arm_order: [parent_00, item_a_10, item_b_01, LENGTH]
  success_probability_by_hypothesis:
    A_ONLY: [0.55, 0.80, 0.55, 0.55]
    B_ONLY: [0.55, 0.55, 0.80, 0.55]
    NEITHER: [0.75, 0.70, 0.70, 0.75]
  observation_model: >-
    Within each preselected development task, multiply Bernoulli likelihoods
    for its four reset episodes under the listed probabilities. Treat the two
    development task clusters as independent and multiply their likelihoods.
    These are fixed subjective design assumptions, not fitted ALFWorld
    frequencies; report sensitivity and retain the small-sample descriptive
    claim boundary.
  action_losses:
    retain_a: {A_ONLY: 0.0, B_ONLY: 1.0, NEITHER: 1.0}
    retain_b: {A_ONLY: 1.0, B_ONLY: 0.0, NEITHER: 1.0}
    abstain: {A_ONLY: 0.6, B_ONLY: 0.6, NEITHER: 0.0}
  posterior_update: Bayes rule using the complete verified development factorial outcomes only
  tie_break: abstain
  missing_or_unknown: >-
    Never infer failure or success from an unknown. Stop the study and do not
    update beliefs, replace a task, or issue another provider call.
  fixed_order_comparator: >-
    Evaluate A first, then B. Retain A if its two-family paired success
    difference versus parent is positive with no family regression; otherwise
    retain B under the same rule; otherwise abstain. Never compose.
arms:
  evaluation:
    - ADAPTIVE_CDED
    - CALIBRATION_STRONGEST_SIMPLE
  development_factorial:
    - parent_00
    - item_a_10
    - item_b_01
    - LENGTH
  calibration:
    - NO_SKILL
    - LENGTH
    - STATIC_CDED
    - ADAPTIVE_CDED
    - FIXED_ORDER_CDED
  fixed_order_rule: >-
    Evaluate A first, then B. Retain A if its two-family paired success
    difference versus parent is positive with no family regression; otherwise
    retain B under the same rule; otherwise abstain. Never compose.
  calibration_policy: >-
    Among NO_SKILL, LENGTH, and STATIC_CDED, choose the arm with highest mean
    verified success on the two calibration clusters; ties resolve to lower
    estimated provider cost, then NO_SKILL, LENGTH, STATIC_CDED. Admit ADAPTIVE_CDED as the
    research route only if it has no task-family regression versus that
    baseline and its mean success is strictly greater; otherwise deployment
    abstains to the simple baseline. The independent final always compares
    ADAPTIVE_CDED with the selected baseline. FIXED_ORDER_CDED is reported but
    cannot be selected as the simple baseline.
  adaptive_rule: >-
    Use the frozen decision model, losses, priors, likelihoods, and completed
    factorial observations to select among retain-A, retain-B, and abstain.
    No final outcomes may
    change the selected rule or the candidate.
estimands:
  primary: >-
    Equal-weight mean over the two independent final families of paired hard-gated
    task success difference ADAPTIVE_CDED minus the calibration-selected
    strongest simple baseline; show each family difference and their observed
    range. With n=2, treat this as descriptive rather than a powered interval.
  key_secondary:
    - Development posterior decision and its assumptions/sensitivity
    - Calibration outcomes for NO_SKILL, LENGTH, STATIC_CDED, ADAPTIVE_CDED, and FIXED_ORDER_CDED
    - regressions, repairs, abstentions, unsafe proposals, and unknown outcomes
    - total provider calls, input/output tokens, peak-price estimate, and wall time by stage
    - development experiment cost required to freeze each evolution policy
  claim_boundary: >-
    This is a descriptive two-family independent final pilot, not a powered
    superiority test, not transfer to an unseen ALFWorld native family, and
    not ACRE certification. Report success, cost, abstention, negative
    transfer, and all stage denominators separately.
